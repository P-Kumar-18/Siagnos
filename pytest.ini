[pytest]
testpaths = tests
addopts = --ignore=tests/test_opsis_integration.py
pythonpath = .
markers =
    spec_mismatch: test asserts the Stage 4 specification and currently fails because the implementation still follows legacy behavior (xfail strict, flips loudly once fixed)
    blocked: test scenario is defined by the specification but cannot run because the required interface does not exist yet
    concurrency: needs two simultaneous transactions
    integration: needs a throwaway PostgreSQL database (SIAGNOS_TEST_DSN)
